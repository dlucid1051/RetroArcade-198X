<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#22d3ee" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Starfield backdrop dots -->
  <circle cx="80" cy="120" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="430" cy="90" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="110" cy="390" r="2.5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="410" cy="400" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="260" cy="70" r="3" fill="#e0e7ff" opacity="0.8"/>

  <!-- Vector Asteroid fragments -->
  <polygon points="90,180 130,160 160,200 140,240 100,230" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round" opacity="0.7" />
  <polygon points="370,160 410,140 430,180 400,210 360,190" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round" opacity="0.7" />

  <!-- Authentic Vector Asteroids Ship (Cyan Neon) -->
  <g filter="url(#neon-glow)">
    <polygon points="256,120 180,310 256,275 332,310" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linejoin="miter" stroke-miterlimit="3"/>
  </g>

  <!-- Ship Thruster Flame (Neon Orange/Red) -->
  <g filter="url(#orange-glow)">
    <polygon points="236,290 256,365 276,290" fill="none" stroke="#f97316" stroke-width="8" stroke-linejoin="miter"/>
  </g>

  <!-- Laser Projectile -->
  <circle cx="256" cy="85" r="5" fill="#ec4899" filter="url(#orange-glow)"/>

  <!-- Retro Coin / Arcade Badge Banner -->
  <rect x="146" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="3"/>
  <text x="256" y="443" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#22d3ee" text-anchor="middle" letter-spacing="4">198X ARCADE</text>
</svg>
